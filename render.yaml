services:
  - type: web
    name: livecode-backend
    runtime: node
    plan: starter
    region: oregon
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run db:deploy && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false # Set to your Vercel frontend URL, e.g. https://your-app.vercel.app
      - key: SERVER_URL
        sync: false # Set to your Render backend URL, e.g. https://livecode-backend.onrender.com
      - key: DATABASE_URL
        sync: false # Set to your Neon or PostgreSQL database connection string
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true # Render automatically generates a secure random 256-bit key
      - key: JWT_REFRESH_SECRET
        generateValue: true # Render automatically generates a secure random 256-bit key
      - key: GROQ_API_KEY
        sync: false
      - key: JUDGE0_URL
        value: https://ce.judge0.com
