name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── Job 1: Validate Backend ───────────────────────────────────────
  server-ci:
    name: Backend Tests & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      JWT_ACCESS_SECRET: "ci_dummy_access_secret_12345678"
      JWT_REFRESH_SECRET: "ci_dummy_refresh_secret_12345678"
      NODE_ENV: "test"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run server unit tests (Vitest)
        run: npm run test

      - name: Check build & Prisma generation
        run: npm run build

  # ─── Job 2: Validate Frontend ──────────────────────────────────────
  client-ci:
    name: Frontend Lint, Tests & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (Non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Run client unit tests (Vitest)
        run: npm run test

      - name: Test production Vite build
        run: npm run build
